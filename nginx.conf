# 生产 Nginx：图片已以内嵌 data URL 进库，无文件目录可直出，前后端统一反代到 app
events {}

http {
  include mime.types;
  upstream app {
    server app:3001;
  }

  server {
    listen 80;
    client_max_body_size 5m;

    location / {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
